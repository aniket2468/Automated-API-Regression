openapi: 3.0.3
info:
  title: Catalog API
  version: 2.0.0
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      responses:
        '200':
          description: Product catalog
          headers:
            X-API-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      operationId: getProduct
      summary: Get one product
      responses:
        '200':
          description: Product found
          headers:
            X-API-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
components:
  schemas:
    Product:
      type: object
      required: [id, title, price]
      properties:
        id:
          type: integer
        title:
          type: string
        price:
          type: number
          minimum: 0
