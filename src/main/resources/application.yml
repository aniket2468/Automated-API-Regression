debug: false
trace: false
logging:
  level:
    root: INFO
    org.springframework: INFO
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: api-guard
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/apiguard;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  allowed-hosts: ${API_ALLOWED_HOSTS:localhost,127.0.0.1}
  workers: 8
  max-concurrent-runs: 2
  queue-capacity: 32
